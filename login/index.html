<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Aetheris</title>
    <meta name="description" content="Sign in to your Aetheris account." />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;430;450;480;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#17191c',
              paper: '#ffffff',
              mist: '#f2f2f3',
              fog: '#fafafb',
              slate: '#777b86',
              ash: '#979799',
              smoke: '#a3a6af',
              blush: '#fbe1d1',
              sienna: '#5d2a1a',
            },
            fontFamily: {
              signifier: ['"Source Serif 4"', 'ui-serif', 'Georgia', 'serif'],
              sohne: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            fontSize: {
              'caption': ['15px', { lineHeight: '1.5' }],
              'body': ['17px', { lineHeight: '1.35' }],
              'body-lg': ['20px', { lineHeight: '1.35' }],
              'subheading': ['22px', { lineHeight: '1.5' }],
              'heading-sm': ['26px', { lineHeight: '1.18', letterSpacing: '-0.23px' }],
              'heading': ['44px', { lineHeight: '1.3', letterSpacing: '-0.66px' }],
              'heading-lg': ['64px', { lineHeight: '1.3', letterSpacing: '-0.96px' }],
              'display': ['90px', { lineHeight: '1.3', letterSpacing: '-2.25px' }],
            },
            borderRadius: {
              'cards': '24px',
              'images': '12px',
              'inputs': '16px',
              'pill': '9999px',
              'small-cards': '16px',
              'elevated': '20px',
            },
            boxShadow: {
              'floating': '0 0 0 1px rgba(4,23,43,0.05), 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1)',
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        background-color: #ffffff;
        color: #17191c;
        -webkit-font-smoothing: antialiased;
      }
      .snappy-transition {
        transition: all 0.2s ease-out;
      }
      
      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.4);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
      }
    </style>
</head>

<body class="bg-fog text-ink font-sohne text-body selection:bg-blush selection:text-sienna min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="w-full bg-transparent sticky top-0 z-50">
        <div class="max-w-[1200px] mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <span class="font-signifier font-normal text-2xl text-ink">Aetheris</span>
            </a>
            <div class="flex items-center gap-3">
                <span class="text-caption text-slate hidden sm:inline">Don't have an account?</span>
                <a href="/signup/" class="text-caption text-ink hover:text-slate snappy-transition">Create account <i data-lucide="arrow-right" class="w-4 h-4 inline-block -mt-0.5"></i></a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-6 py-12 relative">
        <div class="w-full max-w-[480px]">
            
            <div class="bg-blush rounded-cards p-8 mb-8 text-center">
                <h1 class="font-signifier text-heading-sm font-normal tracking-tight text-sienna mb-2">Sign in</h1>
                <p class="text-caption text-sienna">Access your Aetheris account</p>
            </div>

            <div class="bg-paper rounded-cards shadow-floating p-8 md:p-10">
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5" novalidate>
                
                <!-- Email address -->
                <div>
                    <label for="email" class="block text-caption font-medium text-ink mb-2">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required
                        class="w-full px-5 py-3.5 bg-paper border border-mist rounded-inputs text-body text-ink placeholder-smoke focus:outline-none focus:border-slate snappy-transition" />
                    <p id="email-error" class="hidden mt-2 text-[14px] font-medium text-sienna bg-blush px-3 py-1.5 rounded-md inline-block">Please enter a valid email address.</p>
                </div>

                <!-- Password -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-caption font-medium text-ink">Password</label>
                        <a href="#" class="text-caption text-slate hover:text-ink snappy-transition">Forgot?</a>
                    </div>
                    <div class="relative">
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required
                            class="w-full px-5 py-3.5 pr-12 bg-paper border border-mist rounded-inputs text-body text-ink placeholder-smoke focus:outline-none focus:border-slate snappy-transition" />
                        <button type="button" onclick="togglePwLucide('password','eye1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-smoke hover:text-ink snappy-transition" aria-label="Toggle password visibility">
                            <i id="eye1" data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <p id="password-error" class="hidden mt-2 text-[14px] font-medium text-sienna bg-blush px-3 py-1.5 rounded-md inline-block">Password must be at least 6 characters.</p>
                </div>

                <!-- Submit -->
                <button id="submit-btn" type="submit"
                    class="w-full mt-4 flex items-center justify-center gap-2 bg-ink text-paper font-medium text-body rounded-pill py-4 border border-ink hover:opacity-90 snappy-transition">
                    <span id="btn-text">Sign in</span>
                    <span id="btn-spinner" class="hidden spinner"></span>
                </button>
            </form>
            </div>
            
        </div>
    </main>

    <script>
        lucide.createIcons();

        function togglePwLucide(inputId, iconId) {
            const inp = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (inp.type === 'password') {
                inp.type = 'text';
                const newIcon = document.createElement('i');
                newIcon.setAttribute('id', iconId);
                newIcon.setAttribute('data-lucide', 'eye-off');
                newIcon.className = 'w-5 h-5';
                icon.parentNode.replaceChild(newIcon, icon);
            } else {
                inp.type = 'password';
                const newIcon = document.createElement('i');
                newIcon.setAttribute('id', iconId);
                newIcon.setAttribute('data-lucide', 'eye');
                newIcon.className = 'w-5 h-5';
                icon.parentNode.replaceChild(newIcon, icon);
            }
            lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let valid = true;

            const emailErr = document.getElementById('email-error');
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailErr.classList.remove('hidden'); valid = false;
            } else { emailErr.classList.add('hidden'); }

            const pwErr = document.getElementById('password-error');
            if (!password || password.length < 6) {
                pwErr.classList.remove('hidden'); valid = false;
            } else { pwErr.classList.add('hidden'); }

            if (!valid) return;

            const btn = document.getElementById('submit-btn');
            document.getElementById('btn-text').textContent = 'Signing in…';
            document.getElementById('btn-spinner').classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const apiBaseUrl = (window.VITE_API_BASE_URL || 'https://ai-backend-zfq1.onrender.com').replace(/\/$/, '');
                const res = await fetch(`${apiBaseUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    if (data.access_token) localStorage.setItem('access_token', data.access_token);
                    if (data.user_id) localStorage.setItem('user_id', data.user_id);
                    window.location.href = '/dashboard/';
                } else {
                    let errorMsg = 'Login failed. Please check your credentials.';
                    try {
                        const errData = await res.json();
                        errorMsg = errData.detail || errData.message || errorMsg;
                    } catch (_) {}
                    alert(errorMsg);
                    btn.disabled = false;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    document.getElementById('btn-text').textContent = 'Sign in';
                    document.getElementById('btn-spinner').classList.add('hidden');
                }
            } catch (err) {
                alert('An error occurred while signing in. Please check your connection.');
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                document.getElementById('btn-text').textContent = 'Sign in';
                document.getElementById('btn-spinner').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
