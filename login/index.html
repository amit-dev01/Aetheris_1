<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Aetheris</title>
    <meta name="description" content="Sign in to your Aetheris account." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF3000'/><text y='.75em' x='.15em' font-size='70' fill='white' font-family='sans-serif' font-weight='bold'>A</text></svg>" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration for Swiss Typographic Design System -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              paperBg: '#FFFFFF',
              darkBg: '#000000',
              slateFg: '#000000',
              accent: '#FF3000',
              secondary: '#000000',
              tertiary: '#F2F2F2',
              quaternary: '#FF3000',
            },
            fontFamily: {
              sans: ['"Inter"', 'system-ui', 'sans-serif'],
              heading: ['"Inter"', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Custom CSS for Swiss Typographic Design System -->
    <style>
      html { scroll-behavior: smooth; }

      .swiss-dots {
        background-image: radial-gradient(rgba(0, 0, 0, 0.05) 1.5px, transparent 1.5px);
        background-size: 16px 16px;
      }
      .dark .swiss-dots {
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
        background-size: 16px 16px;
      }

      .chunky-border { border: 4px solid #000000; }
      .dark .chunky-border { border: 4px solid #FFFFFF; }

      .snappy { transition: all 0.15s ease-out; }

      .geo-input {
        border: 2px solid #000000;
        border-radius: 0px !important;
        transition: border-color 0.15s ease, background-color 0.15s ease;
        outline: none;
      }
      .geo-input:focus {
        border-color: #FF3000;
      }
      .dark .geo-input {
        border-color: #FFFFFF;
        background: #000000;
        color: #FFFFFF;
      }
      .dark .geo-input:focus {
        border-color: #FF3000;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      .spinner {
        width: 18px; height: 18px;
        border: 3px solid rgba(255,255,255,0.4);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: inline-block;
      }
    </style>
  </head>

  <body class="bg-paperBg dark:bg-darkBg font-sans min-h-screen flex flex-col antialiased">

    <script>
      if (localStorage.getItem('aetheris-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- NAVBAR -->
    <nav class="w-full border-b-4 border-black dark:border-white bg-paperBg dark:bg-darkBg">
      <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3 group">
          <div class="w-8 h-8 bg-accent text-white flex items-center justify-center border-2 border-black dark:border-white snappy group-hover:-translate-y-0.5">
            <span class="font-extrabold text-base uppercase">A</span>
          </div>
          <span class="font-heading font-black text-xl uppercase tracking-wider text-slateFg dark:text-white">Aetheris</span>
        </a>
        <div class="flex items-center gap-6">
          <button id="theme-toggle" class="w-10 h-10 flex items-center justify-center bg-white dark:bg-black border-2 border-black dark:border-white snappy hover:bg-accent hover:text-white" aria-label="Toggle theme">
            <svg class="w-4 h-4 hidden dark:block" fill="currentColor" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a href="/signup/" class="font-heading font-black text-sm uppercase tracking-widest text-accent hover:underline snappy">Create account →</a>
        </div>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="flex-1 swiss-dots flex items-center justify-center px-6 py-16 relative overflow-hidden">

      <!-- Stark Layout Blocks (No floating ornaments, just pure Swiss layout) -->
      <div class="relative z-10 w-full max-w-md">
        <div class="bg-white dark:bg-black border-4 border-black dark:border-white p-8 sm:p-10 rounded-none">

          <!-- Header -->
          <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-accent border-2 border-black dark:border-white mb-5 text-white">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <h1 class="font-heading font-black text-2xl uppercase tracking-widest text-slateFg dark:text-white">Sign In</h1>
            <p class="mt-2 text-xs font-black text-slate-500 uppercase tracking-widest">Access your Aetheris account</p>
          </div>

          <!-- Google -->
          <button onclick="handleSocialLogin()" class="w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-none border-2 border-black dark:border-white bg-white dark:bg-black text-slateFg dark:text-white font-heading font-black text-xs uppercase tracking-widest hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black snappy mb-6">
            <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>

          <!-- Divider -->
          <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 h-0.5 bg-black dark:bg-white"></div>
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">or</span>
            <div class="flex-1 h-0.5 bg-black dark:bg-white"></div>
          </div>

          <!-- Form -->
          <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5" novalidate>

            <div>
              <label for="email" class="block text-xs font-black text-slateFg dark:text-slate-300 uppercase tracking-widest mb-1.5">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email"
                placeholder="you@example.com" required
                class="geo-input w-full px-4 py-3 text-sm bg-white dark:bg-black text-slateFg dark:text-white placeholder:text-slate-400" />
              <p id="email-error" class="hidden mt-1.5 text-xs font-bold text-accent uppercase tracking-wider">Please enter a valid email address.</p>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label for="password" class="text-xs font-black text-slateFg dark:text-slate-300 uppercase tracking-widest">Password</label>
                <a href="#" class="text-xs font-black text-accent hover:underline uppercase tracking-wider">Forgot?</a>
              </div>
              <div class="relative">
                <input id="password" name="password" type="password" autocomplete="current-password"
                  placeholder="••••••••" required
                  class="geo-input w-full px-4 py-3 pr-12 text-sm bg-white dark:bg-black text-slateFg dark:text-white placeholder:text-slate-400" />
                <button type="button" onclick="togglePw('password','eye1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slateFg dark:hover:text-white snappy" aria-label="Toggle password visibility">
                  <svg id="eye1" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <p id="password-error" class="hidden mt-1.5 text-xs font-bold text-accent uppercase tracking-wider">Password must be at least 6 characters.</p>
            </div>

            <button id="submit-btn" type="submit"
              class="w-full flex items-center justify-center gap-2 bg-black text-white dark:bg-white dark:text-black font-heading font-black text-sm uppercase tracking-widest py-4 border-2 border-black dark:border-white hover:bg-accent hover:text-white dark:hover:bg-accent dark:hover:text-white snappy mt-2 rounded-none">
              <span id="btn-text">Sign in</span>
              <span id="btn-spinner" class="hidden spinner"></span>
            </button>
          </form>

          <p class="mt-7 text-center text-sm text-slate-500">
            Don't have an account?
            <a href="/signup/" class="font-heading font-black text-accent hover:underline ml-1 uppercase">Create one free →</a>
          </p>
        </div>
        <p class="mt-4 text-center text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-600">No credit card required · Free early access</p>
      </div>
    </main>

    <script>
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('aetheris-theme', isDark ? 'dark' : 'light');
      });

      function togglePw(inputId, iconId) {
        const inp = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (inp.type === 'password') {
          inp.type = 'text';
          icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          inp.type = 'password';
          icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      }

      function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        let valid = true;

        const emailErr = document.getElementById('email-error');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailErr.classList.remove('hidden'); valid = false;
        } else { emailErr.classList.add('hidden'); }

        const pwErr = document.getElementById('password-error');
        if (!password || password.length < 6) {
          pwErr.classList.remove('hidden'); valid = false;
        } else { pwErr.classList.add('hidden'); }

        if (!valid) return;

        const btn = document.getElementById('submit-btn');
        document.getElementById('btn-text').textContent = 'Signing in…';
        document.getElementById('btn-spinner').classList.remove('hidden');
        btn.disabled = true;
        btn.classList.add('opacity-80', 'cursor-not-allowed');

        setTimeout(() => { window.location.href = '/dashboard/'; }, 1400);
      }

      function handleSocialLogin() {
        setTimeout(() => { window.location.href = '/dashboard/'; }, 800);
      }
    </script>
  </body>
</html>
